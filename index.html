<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Tracker - Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-public.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body
    class="bg-mesh font-sans text-slate-800 min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 relative overflow-x-hidden selection:bg-maroon-700 selection:text-white"
  >
    <div
      class="absolute top-12 left-10 w-72 h-72 bg-maroon-600/20 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-96 h-96 bg-maroon-800/30 rounded-full blur-3xl pointer-events-none"
    ></div>

    <header class="w-full max-w-md pt-4 text-center z-10">
      <div class="inline-flex items-center justify-center space-x-3 mb-2">
        <div
          class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-maroon-900 via-maroon-800 to-maroon-600 flex items-center justify-center text-white shadow-xl shadow-maroon-950/50 border border-maroon-500/30"
        >
          <i class="fa-solid fa-graduation-cap text-2xl"></i>
        </div>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">
        Grade Tracker
      </h1>
    </header>

    <main class="w-full max-w-md my-auto py-6 z-10 fade-in">
      <div
        class="glass-card rounded-3xl shadow-2xl overflow-hidden border border-maroon-200/40 min-h-[500px]"
      >
        <div
          id="mainNavTabs"
          class="flex border-b border-slate-100 bg-slate-50/70 p-1.5"
        >
          <button
            type="button"
            id="loginTabBtn"
            onclick="switchTab('login')"
            class="flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-2xl transition-all text-maroon-800 bg-white shadow-sm flex items-center justify-center gap-2 cursor-pointer"
          >
            <i class="fa-solid fa-right-to-bracket text-maroon-700"></i> Log In
          </button>
          <button
            type="button"
            id="registerTabBtn"
            onclick="switchTab('register')"
            class="flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-2xl transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2 cursor-pointer"
          >
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </div>

        <div
          id="authAlert"
          class="hidden mx-6 mt-5 p-3.5 rounded-2xl text-xs font-semibold flex items-start gap-2.5 transition-all"
        >
          <i
            id="alertIcon"
            class="fa-solid fa-circle-exclamation mt-0.5 text-sm"
          ></i>
          <span id="alertMessage"></span>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="p-6 sm:p-8 fade-in">
          <!-- Role Selector -->
          <div class="mb-5 p-1 bg-slate-100 rounded-xl flex gap-1">
            <button
              type="button"
              id="studentRoleBtn"
              onclick="selectRole('student')"
              class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-maroon-900 bg-white shadow-sm flex items-center justify-center gap-1.5 cursor-pointer"
            >
              <i class="fa-solid fa-user-graduate"></i> Student
            </button>
            <button
              type="button"
              id="professorRoleBtn"
              onclick="selectRole('professor')"
              class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 cursor-pointer"
            >
              <i class="fa-solid fa-chalkboard-user"></i> Professor
            </button>
          </div>

          <form
            id="loginForm"
            action="#"
            method="POST"
            onsubmit="return handleLoginValidation(event);"
            class="space-y-4"
          >
            <input
              type="hidden"
              name="userRole"
              id="userRoleInput"
              value="student"
            />

            <div>
              <label
                for="loginEmail"
                id="loginEmailLabel"
                class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5"
                >Student Email (@iskolarngbayan.pup.edu.ph)</label
              >
              <div class="relative">
                <i
                  id="loginEmailIcon"
                  class="fa-solid fa-user-graduate absolute left-4 top-3.5 text-slate-400 text-sm"
                ></i>
                <input
                  type="email"
                  name="loginEmail"
                  id="loginEmail"
                  required
                  class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400"
                  placeholder="e.g. name@iskolarngbayan.pup.edu.ph"
                />
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label
                  for="loginPassword"
                  class="block text-xs font-bold uppercase tracking-wider text-slate-600"
                  >Password</label
                >
              </div>
              <div class="relative">
                <i
                  class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"
                ></i>
                <input
                  type="password"
                  id="loginPassword"
                  name="loginPassword"
                  required
                  class="w-full pl-11 pr-11 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400"
                  placeholder="••••••••"
                />
                <button
                  type="button"
                  onclick="togglePasswordVisibility('loginPassword', this)"
                  class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 transition"
                >
                  <i class="fa-solid fa-eye text-sm"></i>
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1">
              <label class="flex items-center space-x-2.5 cursor-pointer">
                <input
                  type="checkbox"
                  id="rememberMe"
                  name="rememberMe"
                  class="w-4 h-4 rounded border-slate-300 text-maroon-800 focus:ring-maroon-700"
                />
                <span class="text-xs text-slate-600 font-medium"
                  >Remember me</span
                >
              </label>
            </div>

            <button
              type="submit"
              class="w-full py-3.5 bg-gradient-to-r from-maroon-900 via-maroon-800 to-maroon-700 hover:from-maroon-950 hover:to-maroon-800 text-white font-bold rounded-2xl transition duration-200 shadow-xl shadow-maroon-900/30 text-sm flex items-center justify-center space-x-2 group cursor-pointer"
            >
              <span id="signInBtnText">Sign In as Student</span>
              <i
                class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"
              ></i>
            </button>
          </form>
        </div>

        <!-- Register Form -->
        <form
          id="registerForm"
          action="#"
          method="POST"
          onsubmit="return handleRegister(event);"
          class="p-6 sm:p-8 space-y-4 hidden fade-in"
        >
          <div>
            <label
              for="regFullName"
              class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5"
              >Full Name</label
            >
            <div class="relative">
              <i
                class="fa-solid fa-id-card absolute left-4 top-3.5 text-slate-400 text-sm"
              ></i>
              <input
                type="text"
                name="regFullName"
                id="regFullName"
                required
                class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400"
                placeholder="Full Name"
              />
            </div>
          </div>

          <div>
            <label
              for="regRole"
              class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5"
              >Register As</label
            >
            <div class="relative">
              <i
                class="fa-solid fa-user-gear absolute left-4 top-3.5 text-slate-400 text-sm"
              ></i>
              <select
                id="regRole"
                name="regRole"
                required
                onchange="handleRegRoleChange(this.value)"
                class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium appearance-none bg-white"
              >
                <option value="student">Student</option>
                <option value="professor">Professor</option>
              </select>
            </div>
          </div>

          <div>
            <label
              for="regEmail"
              class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5"
              >Email Address</label
            >
            <div class="relative">
              <i
                class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"
              ></i>
              <input
                type="email"
                id="regEmail"
                name="regEmail"
                required
                class="w-full pl-11 pr-4 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400"
                placeholder="e.g. name@iskolarngbayan.pup.edu.ph"
              />
            </div>
            <p
              id="regEmailHint"
              class="text-[10px] text-slate-500 font-medium mt-1"
            >
              Must end with
              <span
                class="font-bold text-maroon-700"
                id="regEmailDomainRequired"
                >@iskolarngbayan.pup.edu.ph</span
              >
            </p>
          </div>

          <div>
            <label
              for="regPassword"
              class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5"
              >Password</label
            >
            <div class="relative">
              <i
                class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"
              ></i>
              <input
                type="password"
                id="regPassword"
                name="regPassword"
                required
                minlength="6"
                class="w-full pl-11 pr-11 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400"
                placeholder="Minimum 6 characters"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility('regPassword', this)"
                class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 transition"
              >
                <i class="fa-solid fa-eye text-sm"></i>
              </button>
            </div>
          </div>

          <div>
            <label
              for="regConfirmPassword"
              class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5"
              >Confirm Password</label
            >
            <div class="relative">
              <i
                class="fa-solid fa-shield-halved absolute left-4 top-3.5 text-slate-400 text-sm"
              ></i>
              <input
                type="password"
                id="regConfirmPassword"
                name="regConfirmPassword"
                required
                minlength="6"
                class="w-full pl-11 pr-11 py-3 rounded-2xl border border-slate-200 focus:border-maroon-600 focus:ring-4 focus:ring-maroon-600/10 outline-none transition text-sm text-slate-800 font-medium placeholder-slate-400"
                placeholder="Re-enter password"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility('regConfirmPassword', this)"
                class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 transition"
              >
                <i class="fa-solid fa-eye text-sm"></i>
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button
              type="submit"
              class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl transition duration-200 shadow-xl text-sm flex items-center justify-center space-x-2 cursor-pointer"
            >
              <i class="fa-solid fa-user-check text-xs"></i>
              <span>Register Account</span>
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer class="w-full max-w-md text-center py-3 z-10">
      <p class="text-maroon-200/60 text-xs font-medium">© Grade Tracker</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
